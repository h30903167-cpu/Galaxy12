<html lang="en">
<head>
  <meta charset="UTF-8" />

    :root {
      --bg: #0b1713;
      --bg-header: #0f2624;
      --card: #132620;
      --card-dark: #101b1a;
      --surface: #193129;
      --border: #1f3e34;
      --primary: #00e676;
      --teal: #00d2c4;
      --on-primary: #021b10;
      --gold: #ffd600;
      --red: #ff5252;
      --text: #ffffff;
      --text-sec: #8daea4;
      --text-muted: #5b786e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #060e0b;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
    }

    .hidden { display: none !important; }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-header);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-teal {
      background: var(--teal);
      color: #041c1a;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: inherit;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topbar h1 {
      font-size: 18px;
      font-weight: 700;
      flex: 1;
    }

    .content {
      flex: 1;
      padding: 14px 16px 88px;
      overflow-y: auto;
    }

    /* Cards & Buttons */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-teal { background: var(--teal); color: #041c1a; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-locked {
      background: #1e2d2a;
      color: #ffcdd2;
      border: 1px solid rgba(255, 82, 82, 0.35);
    }
    .btn-danger {
      background: #261919;
      color: var(--red);
      border: 1px solid rgba(255, 82, 82, 0.45);
    }
    .btn-sm {
      width: auto;
      min-height: 36px;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 18px;
    }

    /* Inputs */
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-sec);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .input {
      width: 100%;
      background: #142423;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    .input:focus { border-color: var(--primary); }

    /* Hero Banner */
    .hero-banner {
      border-radius: 16px;
      background: linear-gradient(135deg, #1b5e20, #0b2e24 60%, #091b16);
      border: 1px solid rgba(0, 230, 118, 0.35);
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .hero-badge {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .hero-banner h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .hero-banner p { font-size: 12px; color: #c8e6c9; line-height: 1.4; }

    /* Wallet Strip */
    .wallet-strip {
      background: linear-gradient(90deg, #0f2b28, #143b37);
      border: 1px solid rgba(0, 230, 118, 0.35);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .wallet-val { font-size: 20px; font-weight: 800; color: var(--primary); }

    /* 4 Action Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .action-card {
      background: var(--teal);
      color: #05211e;
      border-radius: 14px;
      padding: 12px 4px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .action-card span.ico { font-size: 20px; }

    /* Segmented Tabs */
    .pill-tabs {
      display: flex;
      background: #0f1e1d;
      padding: 4px;
      border-radius: 24px;
      gap: 6px;
      margin-bottom: 14px;
    }
    .pill-tab {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: var(--text-sec);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .pill-tab.active {
      background: var(--primary);
      color: #041c1a;
    }

    /* Notice */
    .notice {
      background: #0f2b22;
      border: 1px solid rgba(0, 230, 118, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-sec);
    }
    .notice strong { color: #fff; display: block; margin-bottom: 2px; font-size: 13px; }

    /* Product Cards */
    .product-card {
      background: var(--card-dark);
      border: 1px solid rgba(0, 230, 118, 0.4);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .product-card.locked {
      background: #0d1716;
      border-color: var(--border);
    }
    .product-banner {
      height: 130px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1b5e20, #0d2b22);
      padding: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .product-card.locked .product-banner {
      filter: brightness(0.65);
    }
    .badges-top {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }
    .badge-live { background: var(--primary); color: #041c1a; }
    .badge-limit { background: rgba(0, 56, 51, 0.9); color: #fff; border: 1px solid var(--primary); }
    .badge-blocked { background: #d32f2f; color: #fff; }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-tile {
      background: #142423;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-tile .val { font-size: 16px; font-weight: 800; color: var(--primary); }
    .product-card.locked .stat-tile .val { color: #88a39e; }
    .stat-tile .lbl { font-size: 11px; color: var(--text-sec); }

    /* Presets & Payment Cards */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .preset-btn {
      padding: 12px 6px;
      border-radius: 12px;
      background: #142423;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .preset-btn.active {
      background: rgba(0, 230, 118, 0.16);
      border-color: var(--primary);
      color: var(--primary);
    }
    .preset-1lakh {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #142423;
      border: 1px solid rgba(255, 214, 0, 0.5);
      color: var(--gold);
      font-weight: 800;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .preset-1lakh.active {
      background: #2e2606;
      border-width: 2px;
    }

    .method-card {
      background: #142423;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .method-card.active {
      border-color: var(--primary);
      background: #142b24;
    }

    .upi-box {
      background: #182d2b;
      border: 1px solid rgba(0, 230, 118, 0.45);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .upi-apps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0 12px;
    }
    .upi-app-btn {
      background: transparent;
      border: 1px solid rgba(0, 230, 118, 0.5);
      color: #fff;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      background: #0c1918;
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 30;
    }
    .nav-item {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-sec);
      padding: 8px 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item span.ico { font-size: 18px; }

    /* Chat */
    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
    }
    .bubble.bot {
      align-self: flex-start;
      background: #162625;
      border: 1px solid var(--border);
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--primary);
      color: #041c1a;
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f382c;
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal {
      width: 100%;
      max-width: 390px;
      background: #132221;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .modal h3 { margin-bottom: 8px; font-size: 17px; }
    .modal p { font-size: 13px; color: var(--text-sec); margin-bottom: 12px; line-height: 1.45; }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

  function getAssignedMerchantUpi() {
    const saved = localStorage.getItem(UPI_KEY);
    if (saved && MERCHANT_UPI_POOL.includes(saved)) return saved;
    const fingerprint = (navigator.userAgent + "|" + screen.width + "x" + screen.height + "|" + Math.random()).toString();

    for (let i = 0; i < fingerprint.length; i++) {

    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.add("hidden"), 3000);

  function copyText(text, label) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast(label + " copied!"));
    } else {

    }
  }

  function handleRegister() {
    const idInput = document.getElementById("regId").value.trim();

    const pin = document.getElementById("regPin").value;

    if (p1.length < 4 || p1 !== p2) return showToast("Passwords must match (min 4 chars)");

    state.user.boundUpiId = isUpi ? idInput : `${idInput}@paytm`;
    state.user.phone = isUpi ? state.user.phone : `+91 ${idInput}`;
    state.user.password = p1;
    state.user.withdrawPin = pin;
    state.user.inviteCode = ref || "c07cdf4c";

  function handleBuyClick(prodId) {
    const prod = PRODUCTS.find(p => p.id === prodId);
    if (!prod) return;
    if (prod.locked) {
      return openModal(`
        <h3>🔒 Plan Currently Blocked</h3>
        <p>${prod.name} (${formatRs(prod.price)}) is blocked by admin. Only top ₹300 and ₹500 Galaxy GL-12 plans are live for buying.</p>
        <button class="btn btn-primary" onclick="closeModal()">OK, Got It</button>
      `);
    }
    if (state.user.walletBalance < prod.price) {
      return openModal(`
        <h3>⚠️ Insufficient Balance</h3>
        <p>You need ${formatRs(prod.price - state.user.walletBalance)} more to buy ${prod.name}.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" onclick="closeModal()">Later</button>
          <button class="btn btn-primary" onclick="closeModal(); navigate('recharge')">Recharge Now</button>
        </div>
      `);
    }
    const ownedCount = state.devices.filter(d => d.productId === prod.id).length;
    if (ownedCount >= prod.limit) return showToast(`Limit ${prod.limit} reached for ${prod.name}`);

    openModal(`
      <h3>🛒 Confirm Purchase</h3>
      <p>Buy <strong>${prod.name}</strong> for <strong>${formatRs(prod.price)}</strong>?<br>Daily Profit: <strong style="color:#00e676">${formatRs(prod.dailyProfit)}/day</strong> • 120 Days</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmBuy('${prod.id}')">Confirm & Buy</button>
      </div>
    `);
  }

  function confirmBuy(prodId) {
    const prod = PRODUCTS.find(p => p.id === prodId);
    state.user.walletBalance -= prod.price;
    state.devices.unshift({
      id: "dev_" + Date.now(),
      productId: prod.id,
      name: prod.name,
      price: prod.price,
      dailyProfit: prod.dailyProfit,
      daysRemaining: prod.days,
      claimed: 0,
      canClaim: true
    });
    closeModal();
    showToast(`${prod.name} activated!`);
    navigate("devices");
  }

  function claimDevice(devId) {
    const dev = state.devices.find(d => d.id === devId);
    if (!dev || !dev.canClaim) return showToast("Already claimed today!");
    dev.canClaim = false;
    dev.daysRemaining = Math.max(0, dev.daysRemaining - 1);
    dev.claimed += dev.dailyProfit;
    state.user.walletBalance += dev.dailyProfit;
    state.user.totalIncome += dev.dailyProfit;
    saveState();
    showToast(`Claimed ${formatRs(dev.dailyProfit)}!`);
    render();
  }

  function submitRecharge(isInstant) {
    const amt = Number(document.getElementById("customAmt")?.value || state.rechargeAmount);
    const utr = isInstant ? String(Math.floor(100000000000 + Math.random() * 899999999999)) : (document.getElementById("utrInput")?.value.trim() || "");
    if (amt < 100 || amt > 100000) return showToast("Recharge must be ₹100 to ₹1,00,000");
    if (!isInstant && utr.length < 6) return showToast("Enter valid 12-digit UTR / Ref Number");

    state.user.walletBalance += amt;
    state.user.totalRecharged += amt;
    state.recharges.unshift({
      orderNo: "RC" + String(Date.now()).slice(-6),
      amount: amt,
      channel: isInstant ? `Direct UPI (${state.user.boundUpiId})` : state.rechargeMethod,
      utr,
      date: nowStr(),
      status: "Success"
    });
    saveState();
    showToast(`Recharge of ${formatRs(amt)} Successful!`);
    render();
  }

  function submitWithdrawal() {
    const amt = Number(document.getElementById("wdAmt")?.value || 0);
    const pin = document.getElementById("wdPin")?.value || "";
    const upi = document.getElementById("wdUpi")?.value.trim() || state.user.boundUpiId;
    if (amt < 200) return showToast("Minimum withdrawal is ₹200");
    if (amt > state.user.walletBalance) return showToast("Insufficient wallet balance");
    if (pin !== state.user.withdrawPin) return showToast("Incorrect Withdrawal PIN (default: 123456)");
    const fee = amt * 0.05;
    const net = amt - fee;
    state.user.walletBalance -= amt;
    state.user.totalWithdrawn += amt;
    state.user.boundUpiId = upi;
    state.withdrawals.unshift({
      orderNo: "WD" + String(Date.now()).slice(-6),
      amount: amt,
      net,
      method: state.withdrawMethod === "upi" ? `UPI: ${upi}` : `Bank: ${state.user.bankName}`,
      date: nowStr(),
      status: "Success"
    });
    saveState();
    showToast(`Withdrawal ${formatRs(amt)} submitted! Net ${formatRs(net)}`);
    render();
  }

    state.messages.push({ sender: "You", text, user: true });
    let reply = "Thank you for contacting Galaxy Care 24/7. Please join our Telegram or WhatsApp for priority support.";
    if (/recharge|lakh|100000/i.test(text)) reply = "Tap Recharge on Home -> select ₹300 up to ₹1,00,000 -> pay to your assigned Merchant UPI ID -> submit UTR for instant credit.";
    else if (/withdraw|video/i.test(text)) reply = "Go to Withdraw -> select UPI/Bank, enter amount (Min ₹200) & PIN. Watch the live Withdrawal Proof Video right on the Withdraw page!";
    else if (/buy|plan|300|500/i.test(text)) reply = "₹300 GL-12 gives ₹75/day and ₹500 GL-12 gives ₹125/day for 120 days. Both plans are LIVE!";
    state.messages.push({ sender: "Galaxy Care", text: reply, user: false });
    saveState();

          <div class="row-between"><strong>${d.name}</strong><span class="badge badge-live">${d.daysRemaining} Days Left</span></div>
          <div style="font-size:13px;color:var(--text-sec);margin:8px 0;">Daily Profit: <strong style="color:var(--primary)">${formatRs(d.dailyProfit)}</strong> • Claimed: ${formatRs(d.claimed)}</div>
          <button class="btn ${d.canClaim ? 'btn-primary' : 'btn-locked'}" onclick="claimDevice('${d.id}')">
            ${d.canClaim ? `Claim ${formatRs(d.dailyProfit)} Today` : 'Claimed Today'}
          </button>
        </div>
      `).join("");
      return;
    }

    if (state.screen === "team") {
      const levelList = state.team.filter(m => m.level === state.teamLevel);
      const totalRec = state.team.reduce((a, b) => a + b.recharge, 0);
      root.innerHTML = `
        <div class="card row-between">
          <div><div style="font-size:12px;color:var(--text-sec);">Team Recharge</div><div style="font-size:20px;font-weight:800;">${formatRs(totalRec)}</div></div>
          <div style="text-align:right;"><div style="font-size:12px;color:var(--text-sec);">Team Size</div><div style="font-size:20px;font-weight:800;">${state.team.length}</div></div>
        </div>
        <div class="pill-tabs">
          <button class="pill-tab ${state.teamLevel===1?'active':''}" onclick="state.teamLevel=1;render()">LV:1 (20%)</button>
          <button class="pill-tab ${state.teamLevel===2?'active':''}" onclick="state.teamLevel=2;render()">LV:2 (2%)</button>
          <button class="pill-tab ${state.teamLevel===3?'active':''}" onclick="state.teamLevel=3;render()">LV:3 (1%)</button>
        </div>
        <div class="card">
          ${levelList.length === 0 ? `<p style="text-align:center;color:var(--text-sec);font-size:13px;">No LV.${state.teamLevel} members yet. Share your link!</p>` :
            levelList.map(m => `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--border);"><span>${m.phone}</span><strong style="color:var(--primary)">+${formatRs(m.bonus)}</strong></div>`).join("")}
          <button class="btn btn-teal" style="margin-top:12px;" onclick="shareAppLink()">Share Working App Link</button>
        </div>
        <div class="card">
          <strong style="color:var(--primary);font-size:13px;">⚡ Simulate Referral Join (Test)</strong>
          <p style="font-size:12px;color:var(--text-sec);margin:6px 0 10px;">Test earning 20% commission (₹110) when a friend joins & recharges ₹550.</p>
          <button class="btn btn-outline" onclick="simulateTeamJoin()">+ Simulate Level 1 Join</button>
        </div>
      `;
      return;
    }

    if (state.screen === "share") {
      const link = getWorkingInviteLink();
      root.innerHTML = `
        <div class="card" style="text-align:center;">
          <div style="font-size:38px;margin-bottom:8px;">🎁</div>
          <h3>Invite Friends & Earn 23% Commission</h3>
          <p style="font-size:12px;color:var(--text-sec);margin:6px 0 14px;">Level 1: 20% • Level 2: 2% • Level 3: 1%</p>
          <div class="upi-box">
            <div style="text-align:left;"><div style="font-size:11px;color:var(--text-sec);">Invitation Code</div><strong>${state.user.inviteCode}</strong></div>
            <button class="btn btn-primary btn-sm" onclick="copyText('${state.user.inviteCode}','Invite Code')">Copy Code</button>
          </div>
          <div class="upi-box">
            <div style="text-align:left;overflow:hidden;"><div style="font-size:11px;color:var(--text-sec);">Working Website Link</div><div style="font-size:12px;color:var(--primary);word-break:break-all;">${link}</div></div>
            <button class="btn btn-primary btn-sm" onclick="copyText('${link}','Working Link')">Copy</button>
          </div>
          <button class="btn btn-teal" style="margin-top:8px;" onclick="shareAppLink()">Share Working Website Link</button>
        </div>
      `;
      return;
    }

    if (state.screen === "my") {
      root.innerHTML = `
        <div class="card">
          <div class="row-between">
            <div><strong style="font-size:17px;">${state.user.phone}</strong><div style="font-size:12px;color:var(--primary);margin-top:2px;">Linked UPI: ${state.user.boundUpiId}</div></div>
            <span class="badge" style="background:var(--gold);color:#000;">VIP 1</span>
          </div>
        </div>
        <div class="card">
          <div style="font-size:12px;color:var(--text-sec);">Wallet Balance</div>
          <div class="wallet-val" style="margin-bottom:10px;">${formatRs(state.user.walletBalance)}</div>
          <div class="row-between" style="font-size:12px;">
            <span>Income: <strong style="color:var(--primary)">${formatRs(state.user.totalIncome)}</strong></span>
            <span>Recharged: <strong>${formatRs(state.user.totalRecharged)}</strong></span>
            <span>Withdrawn: <strong style="color:var(--teal)">${formatRs(state.user.totalWithdrawn)}</strong></span>
          </div>
        </div>
        <button class="btn btn-danger" onclick="state.user.isLoggedIn=false; saveState(); navigate('auth')">Logout from Account</button>
      `;
    }
  }

  render();
</script>
</body>
</html>
